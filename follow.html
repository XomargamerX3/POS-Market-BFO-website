<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة البلاغ - POS Market BFO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #3f37c9;
            --dark: #212529;
            --gray: #6c757d;
            --white: #ffffff;
            --bg: #f0f2f5;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo { font-weight: 800; font-size: 20px; color: var(--white); text-decoration: none; }

        header nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin-inline-start: 16px;
            opacity: .92;
        }

        header nav a:hover { opacity: 1; }

        main {
            flex: 1;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .08);
            max-width: 640px;
            width: 100%;
            padding: 30px;
            border-top: 6px solid var(--primary);
        }

        h1 { font-size: 24px; margin-bottom: 8px; }

        .sub { color: var(--gray); font-size: 14.5px; margin-bottom: 20px; line-height: 1.9; }

        form { display: flex; gap: 10px; flex-wrap: wrap; }

        input {
            flex: 1;
            min-width: 200px;
            padding: 13px 16px;
            border: 2px solid #e3e8ee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 1px;
            direction: ltr;
            text-align: left;
            text-transform: uppercase;
            background: #fbfcfd;
            color: var(--dark);
        }

        input:focus { outline: none; border-color: var(--primary); background: var(--white); }

        button {
            border: 0;
            background: var(--primary);
            color: var(--white);
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 13px 26px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover:not(:disabled) { background: var(--primary-dark); }
        button:disabled { opacity: .6; cursor: default; }

        #result { margin-top: 22px; }

        .status {
            border-radius: 12px;
            padding: 16px 18px;
            border: 2px solid #e3e8ee;
            background: #fbfcfd;
        }

        .status.fixed { border-color: #27ae60; background: #f2fbf6; }
        .status.working { border-color: #f8961e; background: #fff8ed; }
        .status.note { border-color: var(--primary); background: #f3f6ff; }

        .badge { display: block; font-weight: 800; font-size: 17px; margin-bottom: 8px; }

        .status.fixed .badge { color: #1d6b45; }
        .status.working .badge { color: #9a5b00; }
        .status.note .badge { color: var(--secondary); }

        .reply { white-space: pre-wrap; font-size: 15px; line-height: 1.9; color: #333; }

        .date { display: block; margin-top: 10px; font-size: 12.5px; color: var(--gray); }

        .report {
            margin-top: 14px;
            padding: 14px 16px;
            border: 1px dashed #cfd6e0;
            border-radius: 12px;
            background: #fafbfc;
        }

        .report h3 { font-size: 14px; color: var(--gray); margin-bottom: 8px; }

        .report pre {
            white-space: pre-wrap;
            font-family: inherit;
            font-size: 12.5px;
            line-height: 1.9;
            color: #495057;
            max-height: 260px;
            overflow: auto;
        }

        .empty { color: #c0392b; font-weight: 700; line-height: 1.9; }

        .note-box { margin-top: 14px; font-size: 13px; color: var(--gray); line-height: 1.9; }
        .note-box a { color: var(--primary); font-weight: 800; }

        footer { padding: 18px; text-align: center; font-size: 12.5px; color: var(--gray); }
        footer a { color: var(--primary); text-decoration: none; font-weight: 700; }

        @media (max-width: 520px) {
            .card { padding: 22px 18px; }
            header nav a { margin-inline-start: 0; margin-inline-end: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <a class="logo" href="index.html">🛒 POS Market BFO</a>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="guide.html">📖 الدليل</a>
            <a href="index.html#support">🐞 بلّغ عن خطأ</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h1>🔎 متابعة البلاغ</h1>
            <p class="sub">
                اكتب كود البلاغ اللي خدته بعد الإرسال (زي <b>BFO-4821</b>) وشوف رد المطور عليه.
                الكود بيتبعت جوه البلاغ نفسه كمان.
            </p>
            <form id="followForm" autocomplete="off" novalidate>
                <input id="code" type="text" maxlength="12" placeholder="BFO-4821" aria-label="كود البلاغ" spellcheck="false">
                <button type="submit" id="go">اعرض الرد</button>
            </form>
            <div id="result"></div>
        </div>
    </main>

    <footer>
        <a href="index.html">الرئيسية</a> ·
        <a href="guide.html">دليل الاستخدام</a> ·
        <a href="index.html#support">الإبلاغ عن خطأ</a>
        <br>© 2026 POS Market BFO — عمر بن مامو
    </footer>

    <script>
        const REPLIES_URL = 'https://raw.githubusercontent.com/XomargamerX3/POS-Market-BFO-website/main/replies.json';
        const REPLIES_API = 'https://api.github.com/repos/XomargamerX3/POS-Market-BFO-website/contents/replies.json?ref=main';
        const INBOX = 'https://ntfy.sh/posbfo-bug-reports-7qm4x2v9';

        const input = document.getElementById('code');
        const btn = document.getElementById('go');
        const form = document.getElementById('followForm');
        const result = document.getElementById('result');

        const BADGES = {
            fixed: ['✅ تم إصلاح المشكلة', 'fixed'],
            working: ['🛠️ جاري العمل عليها', 'working'],
            note: ['💬 رد من المطور', 'note']
        };

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }

        function norm(raw) {
            const s = (raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (s.length === 4) return 'BFO-' + s;
            if (s.indexOf('BFO') === 0 && s.length === 7) return 'BFO-' + s.slice(3);
            return null;
        }

        function getReplies() {
            return fetch(REPLIES_API, {
                headers: { 'Accept': 'application/vnd.github.raw' },
                cache: 'no-store'
            }).then(function (r) {
                if (!r.ok) throw r.status;
                return r.text();
            }).then(function (txt) {
                return JSON.parse(txt);
            }).catch(function () {
                return fetch(REPLIES_URL + '?v=' + Date.now(), { cache: 'no-store' })
                    .then(function (r) {
                        if (!r.ok) throw r.status;
                        return r.json();
                    });
            });
        }

        function getInbox() {
            return fetch(INBOX + '/json?poll=1&since=all', {
                headers: { 'Accept': 'application/x-ndjson' },
                cache: 'no-store'
            }).then(function (r) {
                if (!r.ok) throw r.status;
                return r.text();
            }).then(function (txt) {
                const rows = [];
                txt.split('\n').forEach(function (line) {
                    if (!line.trim()) return;
                    let j;
                    try { j = JSON.parse(line); } catch (e) { return; }
                    if (j.event === 'message' && j.message) rows.push(j);
                });
                return rows;
            }).catch(function () { return null; });
        }

        function hasCode(msg, code) {
            return msg.toUpperCase().replace(/[^A-Z0-9]/g, '').indexOf(code.replace('-', '')) >= 0;
        }

        function findReport(rows, code) {
            let found = null;
            rows.forEach(function (j) {
                if (j.message.indexOf('بلاغ جديد من موقع') === 0 && hasCode(j.message, code)) found = j;
            });
            return found;
        }

        function statusOf(body) {
            const m = body.match(/^(fixed|working|note)\s*[:\-–—]?\s*/i);
            if (m) return { status: m[1].toLowerCase(), body: body.slice(m[0].length) };
            if (/(اتصلح|إصلاح|اصلاح|تصليح)/.test(body)) return { status: 'fixed', body: body };
            if (/(جاري|بشتغل|قيد العمل|لسه شغالين)/.test(body)) return { status: 'working', body: body };
            return { status: 'note', body: body };
        }

        function findInboxReply(rows, code) {
            let found = null;
            rows.forEach(function (j) {
                if (j.message.indexOf('بلاغ جديد من موقع') === 0) return;
                if (j.message.indexOf('You received a file') === 0) return;
                if (!hasCode(j.message, code)) return;
                const stripped = j.message.replace(/BFO[\s\-_]*[A-Z0-9]{4}/i, ' ')
                    .replace(/^[\s:\-–—]+/, '').trim();
                const st = statusOf(stripped);
                found = {
                    status: st.status,
                    reply: st.body,
                    date: new Date((j.time || 0) * 1000).toISOString().slice(0, 10)
                };
            });
            return found;
        }

        function render(entry, repliesOk, report) {
            let html = '';
            if (!repliesOk) {
                html += '<div class="status"><span class="badge">⚠️ ما قدرناش نقرا الردود دلوقتي</span>' +
                        '<div class="reply">اتأكد من الإنترنت وجرّب تاني بعد شوية.</div></div>';
            } else if (entry) {
                const st = BADGES[String(entry.status || '').toLowerCase()] || BADGES.note;
                html += '<div class="status ' + st[1] + '">';
                html += '<span class="badge">' + st[0] + '</span>';
                if (entry.reply) html += '<div class="reply">' + esc(entry.reply) + '</div>';
                if (entry.date) html += '<span class="date">آخر تحديث: ' + esc(entry.date) + '</span>';
                html += '</div>';
            } else {
                html += '<div class="status"><span class="badge">⏳ لسه مفيش رد على الكود ده</span>' +
                        '<div class="reply">لو الكود صح ولسه مفيش رد، ارجع تاني بعد شوية — الردود بتتضاف بعد ما المشكلة تتحل.</div></div>';
            }
            if (report) {
                html += '<div class="report"><h3>📄 البلاغ اللي بعته (محفوظ مؤقتاً عندنا)</h3><pre>' + esc(report.message) + '</pre></div>';
            }
            html += '<p class="note-box">الكود زي <b>BFO-4821</b> — 4 حروف وأرقام بعد BFO. لو ضاع منك، ' +
                    '<a href="index.html#support">ابعت بلاغ جديد</a> وهتاخد كود جديد.</p>';
            result.innerHTML = html;
        }

        function check() {
            const code = norm(input.value);
            if (!code) {
                result.innerHTML = '<p class="empty">الكود مش شكله صح — اكتبه زي BFO-4821.</p>';
                input.focus();
                return;
            }
            input.value = code;

            try { history.replaceState(null, '', 'follow.html?code=' + encodeURIComponent(code)); } catch (e) {}
            try { localStorage.setItem('bfo_last_code', code); } catch (e) {}

            btn.disabled = true;
            const label = btn.textContent;
            btn.textContent = '⏳ بيفحص…';

            let replies = null;
            let repliesOk = false;

            getReplies().then(function (data) {
                replies = data;
                repliesOk = true;
            }).catch(function () {}).then(function () {
                return getInbox();
            }).then(function (rows) {
                let entry = null;
                let report = null;
                if (rows) {
                    report = findReport(rows, code);
                    entry = findInboxReply(rows, code);
                }
                if (!entry && replies) {
                    if (replies[code]) entry = replies[code];
                    else {
                        const keys = Object.keys(replies);
                        for (let i = 0; i < keys.length; i++) {
                            if (keys[i].toUpperCase() === code) { entry = replies[keys[i]]; break; }
                        }
                    }
                }
                render(entry, repliesOk || !!entry, report);
            }).catch(function () {
                result.innerHTML = '<p class="empty">⚠️ حصلت مشكلة وإحنا بنفحص الكود — جرّب تاني.</p>';
            }).then(function () {
                btn.disabled = false;
                btn.textContent = label;
            });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            check();
        });

        (function init() {
            let saved = '';
            try { saved = localStorage.getItem('bfo_last_code') || ''; } catch (e) {}
            const q = new URLSearchParams(location.search).get('code');
            if (q) {
                input.value = q;
                check();
            } else if (saved) {
                input.value = saved;
                check();
            }
        })();
    </script>

</body>
</html>
